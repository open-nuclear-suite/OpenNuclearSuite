name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Check simulator syntax
        run: python -m compileall -q simulators

      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt

      - name: Test reactor pedagogical settings
        run: python -m unittest discover -s simulators/ReactorPhysicsSimulator -p "test_*.py" -v

      - name: Test thermal-hydraulics physics and properties
        run: python -m unittest discover -s simulators/ThermalHydraulicsSimulator -p "test_*.py" -v

      - name: Test hardware-panel protocol and compatibility
        run: python -m unittest discover -s simulators/HardwareReactorControlPanel -p "test_*.py" -v

      - name: Test core-loading physics
        run: python -m unittest discover -s simulators/CoreLoadingSimulator -p "test_*.py" -v
